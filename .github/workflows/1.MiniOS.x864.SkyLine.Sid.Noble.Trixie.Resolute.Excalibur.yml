name: 1. MiniOS x864 SkyLine LXCice Sid Noble Trixie Resolute Excalibur

on:
  schedule:
    - cron: '0 0 */2 * *' # Run every 2 Days
  workflow_dispatch:

env:
  TZ: Etc/GMT-7
  iMageSize: 50GiB
  MainDir: /builder

  BaseBuild: https://github.com/minios-linux/minios-live.git
  #BaseBuild: https://github.com/1ComputerPK/minios.git
  BuildDL: https://github.com/1ComputerPK/minios/releases/download/dl/zMiniOS.SkyLine.01.10.2026.tar.xz
  BuildSource: zMiniOS.SkyLine.01.10.2026.tar.xz
  BuildDir: MiniOS.SkyLine.2026
  CustomVersion: SkyLine Edition 2026 LXCice
  FirefoxDir: linux-live/scripts/03-gui-base/rootcopy-postinstall/opt/
  Firefox64URL: https://download.mozilla.org/?product=firefox-esr-latest&os=linux64&lang=en-US
  Firefox86URL: https://ftp.mozilla.org/pub/firefox/releases/140.17.0esr/linux-i686/en-US/firefox-140.17.0esr.tar.xz

jobs:
  build:
    name: MiniOS-${{ matrix.release }}-${{ matrix.arch }}
    runs-on: ${{ matrix.board == 'uefi-x86' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        release: [ sid, noble, trixie, bookworm, resolute, excalibur ]
        board: [ uefi-x86 ]
        arch: [ amd64 ]
        include:
          #- { release: trixie, arch: i386, board: uefi-x86 }
          - { release: bookworm, arch: i386, board: uefi-x86 }
          #- { release: excalibur, arch: i386, board: uefi-x86 }

    steps:
      - name: Prepare | Init & LVM
        run: |
          lscpu | grep -E "Model name|CPU\(s\):"
          sudo timedatectl set-timezone "${TZ}"
          
          #sudo modprobe f2fs
          sudo truncate -s $iMageSize /mnt.img
          sudo truncate -s $iMageSize /root.img
          Loop1=$(sudo losetup --find --show /mnt.img)
          Loop2=$(sudo losetup --find --show /root.img)
          sudo pvcreate $Loop1 $Loop2
          sudo vgcreate github $Loop1 $Loop2
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.ext4 -F -b 4096 -m 0 -O "has_journal,sparse_super,dir_index" \
           /dev/github/runner

          sudo mkdir -p $MainDir
          sudo mount /dev/github/runner $MainDir
          sudo chown -R runner:runner $MainDir
          df -Th

      - name: Prepare | Source Code
        working-directory: /builder
        run: |
          git clone --depth 1 --single-branch --no-tags \
           ${{ env.BaseBuild }} ${{ env.BuildDir }}
          wget -nv "${{ env.BuildDL }}"
          tar -xf "${{ env.BuildSource }}"

          FF2opt="/builder/${{ env.BuildDir }}/${{ env.FirefoxDir }}"
          mkdir -p "$FF2opt"

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            wget -nv "${{ env.Firefox64URL }}" -O firefox-esr.tar.xz
          else
            wget -nv "${{ env.Firefox86URL }}" -O firefox-esr.tar.xz
          fi

          tar -xf firefox-esr.tar.xz -C "$FF2opt" --transform 's/^firefox/firefox-esr/'

      - name: Build | Compile
        working-directory: /builder/${{ env.BuildDir }}
        run: |
          sudo apt-get update
          sudo chown -R root:root /builder/${{ env.BuildDir }}
          sudo apt-get install -y debootstrap squashfs-tools xz-utils xorriso \
           mtools rsync grub-common e2fsprogs lvm2 pv wget gettext gpgv musl \
           shim-signed grub-efi-amd64-bin grub-efi-amd64-signed musl-tools gcc-multilib

          sudo -E bash ./minios-cmd -d ${{ matrix.release }} -a ${{ matrix.arch }} -de cinnamon \
           -pv standard -c zstd -l en_US -tz "${TZ}" -ib dracut

      - name: Upload | ISO
        uses: actions/upload-artifact@v7
        with:
          name: MiniOS-${{ matrix.release }}-${{ matrix.arch }}-${{ github.run_id }}
          path: /builder/${{ env.BuildDir }}/build/iso/*.iso
          retention-days: 30
          archive: false
          if-no-files-found: error

      - name: Upload | Sb Files
        uses: actions/upload-artifact@v7
        with:
          name: MiniOS-SB-Files-${{ matrix.release }}-${{ matrix.arch }}-${{ github.run_id }}
          path: /builder/${{ env.BuildDir }}/build/*${{ matrix.release }}*/image/minios/*.sb
          retention-days: 30
          archive: true
          if-no-files-found: error
